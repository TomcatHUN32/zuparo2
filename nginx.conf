# ========================================================
# ZUPARO RESTAURANT & POS - NGINX REVERSE PROXY CONFIGURATION
# Telepítési hely: /etc/nginx/sites-available/zuparo.conf
# Bekapcsolás: ln -s /etc/nginx/sites-available/zuparo.conf /etc/nginx/sites-enabled/
# Teszt: nginx -t
# Újratöltés: systemctl reload nginx
# ========================================================

# HTTP átirányítás HTTPS-re
server {
    listen 80;
    listen [::]:80;
    server_name rendeles.zuparo.hu www.rendeles.zuparo.hu;

    # Let's Encrypt Certbot ellenőrzési könyvtár
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Fő HTTPS kiszolgáló
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rendeles.zuparo.hu www.rendeles.zuparo.hu;

    # SSL tanúsítványok (Certbot automatikusan beállítja pl: certbot --nginx -d rendeles.zuparo.hu)
    ssl_certificate /etc/letsencrypt/live/rendeles.zuparo.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rendeles.zuparo.hu/privkey.pem;

    # Biztonságos SSL beállítások
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Biztonsági fejlécek
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximális feltöltési méret (ételek fotóihoz)
    client_max_body_size 15M;

    # GZIP tömörítés a gyors betöltődéshez
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Statikus fájlok gyorsítótárazása
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Node.js Express Backend & React Vite SPA fordított proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket támogatás (valós idejű polling / frissítés)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Valódi kliens IP és protokoll átadása
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Időtúllépési beállítások
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
